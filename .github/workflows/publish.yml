name: Build and publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 10 * * 1"   # weekly rebuild, Mondays
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install RenderCV and PyYAML
        # Pinned: scripts/finalize_pdf.py uses RenderCV internals. Test locally before bumping.
        run: pip install "rendercv[full]==2.8" pyyaml

      - name: Build CV PDF from cv.yml
        run: |
          python scripts/prepare_pdf.py   # adds trainee underlines -> _build/cv.yml
          rendercv render _build/cv.yml -nopdf -nopng -nomd -nohtml   # Typst source only
          python scripts/finalize_pdf.py _build/rendercv_output/*.typ assets/cv.pdf

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Generate pages from cv.yml
        run: python scripts/build_pages.py

      - name: Render site
        run: quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
